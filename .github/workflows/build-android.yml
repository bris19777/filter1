name: Build Android APK

# Builds the debug APK of the Android DNS-filter agent (under android/) and uploads
# it as an artifact. Run manually from the Actions tab, or on an android-v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: filter1-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
