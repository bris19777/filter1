name: Build installer

# Builds the all-in-one Windows installer (filter1-setup.exe) on a Windows
# runner and uploads it as an artifact. Run it manually from the Actions tab,
# or it runs on a version tag push.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Stage payload (private Python + packages + scripts)
        shell: pwsh
        run: |
          $prefix = (python -c "import sys;print(sys.prefix)").Trim()
          New-Item -ItemType Directory -Force -Path installer\payload | Out-Null
          Copy-Item $prefix installer\payload\py -Recurse
          installer\payload\py\python.exe -m pip install --upgrade pip
          installer\payload\py\python.exe -m pip install dnslib mitmproxy certifi
          Copy-Item agent\agent.py            installer\payload\agent.py
          Copy-Item proxy\filter_addon.py     installer\payload\filter_addon.py
          Copy-Item installer\run_proxy.py    installer\payload\
          Copy-Item installer\setup-tasks.ps1 installer\payload\
          Copy-Item installer\uninstall-all.ps1 installer\payload\
          Copy-Item installer\verify-uninstall.ps1 installer\payload\
          # optional, admin-run VPN app-blocking (kept out of the default install)
          Copy-Item installer\harden-apps.ps1    installer\payload\
          Copy-Item installer\unharden-apps.ps1  installer\payload\
          Copy-Item installer\harden-apps.bat    installer\payload\
          Copy-Item installer\unharden-apps.bat  installer\payload\
          # local status / diagnostics tool
          Copy-Item installer\status.py          installer\payload\
          Copy-Item installer\filter1-status.bat installer\payload\
          # public code-signing cert for auto-update trust (only if the operator
          # added it; needed for a self-signed signer, harmless otherwise)
          if (Test-Path installer\codesign.cer) { Copy-Item installer\codesign.cer installer\payload\ }
          # bundle the VC++ runtime so the private Python starts on clean machines
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile installer\payload\vc_redist.x64.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $server = "${{ vars.FILTER1_SERVER }}"
          if (-not $server) { $server = "https://bsd-filter1.fly.dev" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyToken=${{ secrets.AGENT_TOKEN }}" `
            "/DMyServer=$server" `
            installer\filter1.iss

      - name: Sign installer (Authenticode)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          # Code signing is the supported fix for SmartScreen warnings and for
          # Defender flagging a freshly downloaded, low-reputation installer. It
          # runs only when a signing certificate is configured as repo secrets;
          # without them the build still produces a working (unsigned) installer.
          if (-not $env:SIGN_PFX_BASE64) {
            Write-Host "No SIGN_PFX_BASE64 secret set; leaving the installer unsigned."
            exit 0
          }
          $exe = "installer\Output\filter1-setup.exe"
          $pfx = Join-Path $env:RUNNER_TEMP "filter1-sign.pfx"
          # Strip anything that isn't a base64 character. Pasting the secret can
          # introduce line wraps, stray spaces, a BOM or a non-breaking space that
          # break FromBase64String; base64 itself only uses [A-Za-z0-9+/=].
          $b64 = ($env:SIGN_PFX_BASE64 -replace '[^A-Za-z0-9+/=]', '')
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($b64))
          } catch {
            throw "SIGN_PFX_BASE64 is not valid base64 after cleanup (length $($b64.Length)). Re-copy the whole one-line value into the secret."
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\*" } | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe not found on the runner" }
          try {
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
            # A self-signed signer does not chain to a root the runner already
            # trusts, so `verify /pa` would fail with "terminated in a root
            # certificate which is not trusted". Trust our public cert on the
            # runner first (clients trust it via setup-tasks.ps1). No-op for a
            # CA-issued cert, where codesign.cer is absent.
            if (Test-Path installer\codesign.cer) {
              certutil -addstore -f Root installer\codesign.cer | Out-Null
            }
            & $signtool.FullName verify /pa $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed ($LASTEXITCODE)" }
            Write-Host "Installer signed and verified."
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: filter1-setup
          path: installer\Output\filter1-setup.exe
